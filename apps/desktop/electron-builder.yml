# electron-builder config.
# Run `pnpm --filter @cockpitzero/desktop package` to produce installers.
# CI (.github/workflows/release.yml) runs the same with `--publish always`
# on version tags, uploading artifacts to a draft GitHub Release that
# electron-updater consumes for auto-updates.
appId: app.cockpitzero.desktop
productName: CockpitZero
directories:
  output: release
  buildResources: build
files:
  - out/**
mac:
  category: public.app-category.productivity
  # zip is required alongside dmg for electron-updater on macOS.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization runs automatically when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID env vars are present (set as CI secrets).
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
# Auto-update checks hit this repo unauthenticated, so it must stay the PUBLIC
# one. `release.yml` publishes here with the workflow's own GITHUB_TOKEN, which
# is scoped to the repo it runs in — owner must match that repo's owner.
publish:
  provider: github
  owner: Sooraj-Baburaj
  repo: cockpit-zero
  releaseType: draft
