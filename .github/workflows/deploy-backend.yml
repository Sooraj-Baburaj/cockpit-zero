name: Deploy backend

# Builds the backend image, pushes it to GHCR, then updates the VPS via SSH.
# Requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (and the VPS having been
# provisioned per deploy/README.md). Until those are set, run manually via
# workflow_dispatch after provisioning — the SSH step is skipped when the
# secrets are absent, so the image build still works standalone.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Compose project to update
        type: choice
        options: [cockpitzero-staging, cockpitzero-prod]
        default: cockpitzero-staging
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/thebloomin/cockpitzero-backend:latest
            ghcr.io/thebloomin/cockpitzero-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update VPS
        if: ${{ env.HAS_VPS == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cockpitzero/deploy
            PROJECT="${{ inputs.environment || 'cockpitzero-staging' }}"
            ENV_FILE=".env.${PROJECT##*-}"
            docker compose -p "$PROJECT" --env-file "$ENV_FILE" pull api
            docker compose -p "$PROJECT" --env-file "$ENV_FILE" up -d api
