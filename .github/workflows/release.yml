name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) to build signed
# installers for all three platforms and upload them to a draft GitHub
# Release. Publish the draft manually once the smoke checklist passes.
#
# Signing/notarization secrets (builds are produced unsigned until set):
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: Azure Trusted Signing (configure win.azureSignOptions in
#            electron-builder.yml + AZURE_* secrets) — see docs/roadmap.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @cockpitzero/shared build

      - name: Build and publish installers
        run: pnpm --filter @cockpitzero/desktop package --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (skipped when unset)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
