packages:
  - 'apps/*'
  - 'packages/*'

# Centralized dependency versions (pnpm catalogs). Reference in any package
# with "<dep>": "catalog:". Keeps versions consistent across the monorepo.
catalog:
  typescript: ^5.7.3
  prettier: ^3.4.2
  zod: ^3.24.1
  fzf: ^0.5.2
  yaml: ^2.6.1
  vitest: ^3.0.2
  eslint: ^9.18.0
  typescript-eslint: ^8.20.0
  eslint-config-prettier: ^9.1.0
  '@types/node': ^22.10.5
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.5
  '@types/react-dom': ^19.0.3
  tailwindcss: ^4.0.0
  '@tailwindcss/vite': ^4.0.0
  '@tailwindcss/postcss': ^4.0.0
  # Vercel AI SDK — the universal BYOP provider layer (production phase 3). Runs in
  # the desktop main process only (keys never reach the renderer). Dual CJS/ESM, so
  # electron-vite can externalize them from the CJS main build.
  ai: ^6.0.208
  # Local memory engine (production phase 5). Native modules — desktop main process
  # only, never the renderer. electron-vite externalizes them; packaging needs the
  # per-platform prebuilt binary (+ an Electron ABI rebuild for onnxruntime/lancedb).
  '@lancedb/lancedb': ^0.21.1
  '@huggingface/transformers': ^3.7.5
  '@ai-sdk/anthropic': ^3.0.85
  '@ai-sdk/openai': ^3.0.74
  '@ai-sdk/google': ^3.0.83
  '@ai-sdk/xai': ^3.0.96
  '@ai-sdk/mistral': ^3.0.40
  '@ai-sdk/groq': ^3.0.42
  '@ai-sdk/cohere': ^3.0.39
  '@ai-sdk/deepseek': ^2.0.39
  '@ai-sdk/openai-compatible': ^2.0.51
