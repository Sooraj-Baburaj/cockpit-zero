packages:
  - "apps/*"
  - "packages/*"

# Centralized dependency versions (pnpm catalogs). Reference in any package
# with "<dep>": "catalog:". Keeps versions consistent across the monorepo.
catalog:
  typescript: ^5.7.3
  prettier: ^3.4.2
  zod: ^3.24.1
  fzf: ^0.5.2
  vitest: ^3.0.2
  eslint: ^9.18.0
  typescript-eslint: ^8.20.0
  eslint-config-prettier: ^9.1.0
  "@types/node": ^22.10.5
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.5
  "@types/react-dom": ^19.0.3
  tailwindcss: ^4.0.0
  "@tailwindcss/vite": ^4.0.0
  "@tailwindcss/postcss": ^4.0.0
